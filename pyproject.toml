[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.1.1"
description = "Zero-cost, local-first, privacy-focused evaluation harness for Agentic AI workflows."
readme = "README.md"
authors = [
    { name = "soppressata", email = "312807597+soppressata@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
keywords = ["llm", "evals", "agent", "braintrust", "langsmith", "langfuse", "harness", "ollama", "vllm"]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
harness = "openharness.cli.main:cli"
openharness = "openharness.cli.main:cli"

[project.entry-points."pytest11"]
openharness = "openharness.plugins.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
